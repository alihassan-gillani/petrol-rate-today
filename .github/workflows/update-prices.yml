name: Update OGRA prices
on:
  schedule:
    - cron: "30 19 * * *"   # 00:30 Pakistan time, just after the new price takes effect
    - cron: "30 3 * * *"    # 08:30 Pakistan time, retry in case OGRA published late
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - run: python update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json prices.js
          git diff --cached --quiet || (git commit -m "Update OGRA prices" && git push)
