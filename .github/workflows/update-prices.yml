# Manual only: OGRA blocks GitHub-hosted runners (HTTP 403). Daily updates run on the PC via run_update.bat.
name: Update OGRA prices
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - run: python update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json prices.js
          git diff --cached --quiet || (git commit -m "Update OGRA prices" && git push)
